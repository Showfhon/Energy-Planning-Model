[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "energyplan"
version = "1.0.0"
description = "Least-cost energy investment planning: a capacity-expansion model built from scratch"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["energy", "capacity expansion", "optimisation", "linear programming", "planning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# The core needs nothing. These make it faster and more convenient.
fast = ["scipy>=1.9", "numpy>=1.22"]   # HiGHS backend + vectorised simplex pivots
yaml = ["pyyaml>=5.4"]                 # .yaml scenario files
cbc = ["pulp>=2.7"]                    # alternative LP backend
all = ["scipy>=1.9", "numpy>=1.22", "pyyaml>=5.4", "pulp>=2.7"]

[project.scripts]
energyplan = "energyplan.cli:main"

[tool.setuptools]
packages = ["energyplan"]
